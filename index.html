<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YENEGA - Le marché qui ne dort jamais</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f0; margin: 0; padding: 0; color: #222; }
  header { background: #0E7A3C; color: #C8A44A; padding: 20px; text-align: center; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 5px 0 0; font-size: 14px; color: white; }
  .section { background: white; margin: 15px; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .wallet { display: flex; justify-content: space-between; font-weight: bold; }
  .wallet span:first-child { color: #0E7A3C; }
  .wallet span:last-child { color: #C8A44A; }
  input, select { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #0E7A3C; color: white; border: none; border-radius: 6px; font-size: 16px; margin-top: 8px; }
  .pro { background: #C8A44A; color: white; }
  h2 { font-size: 18px; color: #0E7A3C; }
</style>
</head>
<body>

<header>
  <h1>YENEGA</h1>
  <p>Le marché qui ne dort jamais</p>
</header>

<div class="section">
  <h2>💰 Mon Portefeuille</h2>
  <div class="wallet">
    <span>Réel : 0F</span>
    <span>🔒 Prime bloquée : 250F</span>
  </div>
</div>

<div class="section">
  <h2>🎁 Code Parrainage</h2>
  <input type="text" placeholder="Entrer un code YENEGA-XXX">
  <button>Activer Prime</button>
</div>

<div class="section">
  <h2>📸 Publier un Produit (+50F)</h2>
  <input type="text" placeholder="Nom du produit">
  <select>
    <option>Pagne</option>
    <option>Karité</option>
    <option>Savon</option>
    <option>Épices</option>
    <option>Mode</option>
    <option>Électronique</option>
  </select>
  <input type="text" placeholder="Prix (FCFA)">
  <input type="text" placeholder="Ton numéro WhatsApp">
  <button>Publier +50F</button>
</div>

<div class="section">
  <h2>⭐ Pack PRO - 5000F / 6 mois</h2>
  <p>✓ Badge doré PRO<br>
  ✓ Commission 3% au lieu de 5%<br>
  ✓ Parrainage 400F au lieu de 250F<br>
  ✓ 5 filles autorisées</p>
  <button class="pro">Devenir PRO - 5000F</button>
</div>

</body>
</html>
